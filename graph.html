        --vbg-leading-title: 40px;
        --vbg-leading-section: 32px;
        --vbg-leading-subsection: 26px;
        --vbg-leading-lede: 28px;
        --vbg-flow-tight: var(--vbg-space-2);
        --vbg-flow-copy: var(--vbg-space-4);

        --vbg-reading-width: 68ch;
        --vbg-display-measure: 20ch;

        --vbg-content-width: 1200px;

      @supports selector(body:has(> .vbg-report)) {
        body:has(> .vbg-report) {
          margin: 0;
        }
      }

      :where(.vbg-report *, .vbg-report *::before, .vbg-report *::after) {
        box-sizing: inherit;
      }

      /* Published display primitives must never override the HTML hidden state. */
      .vbg-report[hidden],
      :where(.vbg-report) [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        :where(
          .vbg-report[data-theme='auto']:not(.light-theme):not(.dark-theme),
          .vbg-report:not([data-theme]):not(.light-theme):not(.dark-theme)
        ) {
          color-scheme: dark;
        }
      }

      /* Host theme classes override OS preference without requiring a theme package. */
      :where(.light .vbg-report, .vbg-report.light) {
        color-scheme: light;
      }

      :where(.dark .vbg-report, .vbg-report.dark) {
        color-scheme: dark;
      }

      /* Explicit VBG themes override both host and OS themes. If both classes are present, dark wins. */
      :where(
        .vbg-report.light-theme,
        .vbg-report[data-theme='light']:not(.light-theme):not(.dark-theme)
      ) {
        color-scheme: light;
      }

      :where(
        .vbg-report.dark-theme,
        .vbg-report[data-theme='dark']:not(.light-theme):not(.dark-theme)
      ) {
        color-scheme: dark;
      }

      :where(.vbg-report) :where(h1, h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre) {
        margin-block-start: 0;
      }

      :where(.vbg-report) :where(h1, h2, h3, h4) {
        color: var(--vbg-gray-1000);
        font-weight: var(--vbg-weight-heading);
        text-wrap: balance;
      }

      :where(.vbg-report) .vbg-display,
      :where(.vbg-report) .vbg-title,
      :where(.vbg-report) .vbg-heading-24,
      :where(.vbg-report) .vbg-heading-20,
      :where(.vbg-report) .vbg-heading-16 {
        color: var(--vbg-gray-1000);
        font-weight: var(--vbg-weight-heading);
        text-wrap: balance;
      }

      :where(.vbg-report)
        :where(
          h1,
          h2,
          h3,
          h4,
          .vbg-display,
          .vbg-title,
          .vbg-heading-24,
          .vbg-heading-20,
          .vbg-heading-16
        )
        strong {
        color: inherit;
        font-weight: inherit;
      }

      :where(.vbg-report)
        :where(p, li, dd, blockquote, figcaption, .vbg-summary, .vbg-lede)
        strong {
        color: var(--vbg-gray-1000);
        font-weight: var(--vbg-weight-medium);
      }

      :where(.vbg-report) :where([id]) {
        scroll-margin-top: var(--vbg-space-8);
      }

      :where(.vbg-report) h1 {
        max-width: var(--vbg-title-measure);
        margin-block-end: var(--vbg-space-4);
        font-size: var(--vbg-type-page-title);
        line-height: var(--vbg-leading-page-title);
        letter-spacing: -0.06em;
      }

      :where(.vbg-report) .vbg-title {
        max-width: var(--vbg-title-measure);
        margin-block-end: var(--vbg-space-4);
        font-size: var(--vbg-type-page-title);
        line-height: var(--vbg-leading-page-title);
        letter-spacing: -0.06em;
      }

      :where(.vbg-report) .vbg-display {
        max-width: var(--vbg-display-measure);
        font-size: var(--vbg-type-display);
        line-height: var(--vbg-leading-display);
        letter-spacing: -0.06em;
      }

      :where(.vbg-report) h2,
      :where(.vbg-report) .vbg-heading-24 {
        margin-block-end: var(--vbg-space-4);
        font-size: var(--vbg-type-section);
        line-height: var(--vbg-leading-section);
        letter-spacing: -0.04em;
      }

      :where(.vbg-report) h3,
      :where(.vbg-report) .vbg-heading-20 {
        margin-block-end: var(--vbg-space-3);
        font-size: var(--vbg-type-subsection);
        line-height: var(--vbg-leading-subsection);
        letter-spacing: -0.02em;
      }

      :where(.vbg-report) h4,
      :where(.vbg-report) .vbg-heading-16 {
        margin-block-end: var(--vbg-space-2);
        font-size: 1rem;
        line-height: 1.5rem;
        letter-spacing: -0.02em;
      }

      :where(.vbg-report) p {
        margin-block-end: var(--vbg-space-4);
        line-height: var(--vbg-leading-body);
        text-wrap: pretty;
      }

      :where(.vbg-report) :where(ul, ol) {
        margin-block-end: var(--vbg-space-4);
        padding-inline-start: 1.25rem;
      }

      :where(.vbg-report) li {
        line-height: var(--vbg-leading-body);
      }

      :where(.vbg-report) :where(.vbg-reading, .vbg-flow, .vbg-list) li + li {
        margin-block-start: var(--vbg-flow-tight);
      }

      :where(.vbg-report) :where(.vbg-reading, .vbg-flow, .vbg-list) li > :where(p, ul, ol) {
        margin-block-end: 0;
      }

      :where(.vbg-report) :where(.vbg-reading, .vbg-flow, .vbg-list) li > p + p {
        margin-block-start: var(--vbg-flow-tight);
      }

      :where(.vbg-report) :where(.vbg-reading, .vbg-flow, .vbg-list) li > :where(ul, ol) {
        margin-block-start: var(--vbg-flow-tight);
      }

      :where(.vbg-report) .vbg-list-compact li + li {
        margin-block-start: var(--vbg-space-1);
      }

      :where(.vbg-report) dt {
        font-weight: var(--vbg-weight-medium);
        line-height: var(--vbg-leading-body);

      :where(.vbg-report) dd {
        margin-inline-start: 0;

      :where(.vbg-report) blockquote {
        margin-inline: 0;

      }

      :where(.vbg-report) :where(p, li, dd, figcaption, .vbg-label, .vbg-meta) {
        overflow-wrap: anywhere;
      }

      :where(.vbg-report) :where(td, th) {
        overflow-wrap: break-word;
      }

      :where(.vbg-report) :where(a) {
        color: inherit;

        text-decoration-thickness: 1px;

      }

      :where(.vbg-report) a:hover {

      :where(.vbg-report) .vbg-link {
        color: var(--vbg-text-primary);
        font-weight: var(--vbg-weight-medium);

        text-underline-offset: 3px;
      }

      :where(.vbg-report) .vbg-link:hover {
        text-decoration-color: currentColor;

      :where(.vbg-report) .vbg-link[data-variant='highlight'] {
        color: var(--vbg-blue-900);
      }

      :where(.vbg-report) .vbg-link[data-variant='secondary'] {
        color: var(--vbg-text-secondary);
        font-weight: var(--vbg-weight-regular);
      }

      :where(.vbg-report) .vbg-link[data-variant='secondary']:hover {
        color: var(--vbg-text-primary);
      }

      :where(.vbg-report) :where(a, button, input, select, textarea, summary):focus-visible {
        outline: 2px solid var(--vbg-focus);
        outline-offset: 3px;
      }

      :where(.vbg-report) :where(code, kbd, samp, pre) {
        font-family: var(--vbg-font-mono);
        font-variant-numeric: tabular-nums slashed-zero;
      }

      :where(.vbg-report) :where(code, kbd) {
        border: 1px solid var(--vbg-border-subtle);
        border-radius: 4px;
        background: var(--vbg-gray-100);
        padding: 0.1em 0.3em;
        font-size: 0.875em;
      }

      :where(.vbg-report) .vbg-formula {
        display: block;
        max-width: 100%;
        overflow: visible;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      /* Formula semantics always remain wrap-safe, including additive authored classes. */
      .vbg-report
        :is(
          .vbg-formula,
          [data-vbg-formula],
          [data-formula],
          [class*='vbg-' i][class*='formula' i],
          [class*='vbg-' i][class*='equation' i]
        ) {
        min-inline-size: 0;
        overflow-wrap: anywhere;
        word-break: normal;
        white-space: normal !important;
      }

      :where(.vbg-report) pre {
        overflow: auto;
        border: 1px solid var(--vbg-border-subtle);
        border-radius: var(--vbg-radius);
        background: var(--vbg-background-200);
        padding: var(--vbg-space-4);
        font-size: 0.8125rem;
        line-height: 1.55;
      }

      :where(.vbg-report) pre code {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: inherit;
      }

      :where(.vbg-report) :where(img, svg, video, canvas) {
        display: block;
        max-width: 100%;
        height: auto;
      }

      :where(.vbg-report) figure {
        margin-inline: 0;
        margin-block-end: var(--vbg-space-8);

      :where(.vbg-report) figcaption,
      :where(.vbg-report) .vbg-caption {

        line-height: var(--vbg-leading-compact);
      }

      :where(.vbg-report) .vbg-shell {
        width: min(calc(100% - 48px), var(--vbg-content-width));
        margin-inline: auto;
        padding-block: clamp(40px, 7vw, 80px);
        container-name: vbg-shell;
        container-type: inline-size;
      }

      :where(.vbg-report) .vbg-header {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        column-gap: var(--vbg-space-6);
        row-gap: 0;
        padding-block-end: clamp(32px, 5vw, 56px);
      }

      :where(.vbg-report) .vbg-header > * {
        grid-column: 1 / -1;
        min-width: 0;
        margin-block: 0;
      }

      :where(.vbg-report) .vbg-header > :where(h1, .vbg-title, .vbg-display) {

      :where(.vbg-report) .vbg-header > :where(.vbg-summary, .vbg-lede) {

      :where(.vbg-report) .vbg-header > * + * {

      :where(.vbg-report) .vbg-header > .vbg-context + :where(h1, .vbg-title, .vbg-display) {

        display: grid;

        gap: var(--vbg-space-3) var(--vbg-space-6);
        align-items: first baseline;
      }

      /* Unknown masthead content stays readable instead of entering a narrow track. */
      :where(.vbg-report) .vbg-masthead > * {
        grid-column: 1 / -1;
        min-width: 0;

      @supports selector(.vbg-masthead:has(> .vbg-identity)) {

          grid-row: 1;
        }

        :where(.vbg-report)
          .vbg-masthead:has(> .vbg-identity):has(> .vbg-document-meta)
          > .vbg-document-meta {
          grid-column: 2;
          grid-row: 1;
        }

      @media (forced-colors: active) {
        :where(.vbg-report)
          :where(
            .vbg-surface,
            .vbg-callout,
            .vbg-table-wrap,
            .vbg-calculator,
            .vbg-evidence,
            .vbg-action,
            .vbg-decision,
            .vbg-recommendation,
            .vbg-next-step,
            .vbg-band,
            .vbg-stat-strip,
            .vbg-unit-field
          ) {
          border: 1px solid CanvasText;
        }

        :where(.vbg-report)
          :where(.vbg-surface, .vbg-evidence, .vbg-calculator)
          :is(.vbg-surface, .vbg-evidence, .vbg-calculator, .vbg-table-wrap) {
          border: 0;
        }

        :where(.vbg-report) .vbg-stat {
          background: Canvas;
          outline: 1px solid CanvasText;
          outline-offset: -1px;
        }

        :where(.vbg-report) .vbg-band[data-tone='contrast'] {
          background: Canvas;
          color: CanvasText;
        }

        :where(.vbg-report)
          .vbg-band[data-tone='contrast']
          :where(h1, h2, h3, h4, p, a, .vbg-link, .vbg-label, .vbg-meta, .vbg-stat-value) {
          color: CanvasText;
        }

        :where(.vbg-report) :where(a, button, input, select, textarea):focus-visible {
          outline-color: Highlight;
        }

        :where(.vbg-report)
          :where(
            button[aria-pressed='true'],
            .vbg-button[aria-pressed='true'],
            button[data-selected='true'],
            .vbg-button[data-selected='true'],
            button[data-state='active'],
            .vbg-button[data-state='active']
          ) {
          border-color: Highlight;
          background: Highlight;
          color: HighlightText;
          forced-color-adjust: none;
        }

        :where(.vbg-report) input[type='range']::-webkit-slider-runnable-track {
          background: CanvasText;
        }

        :where(.vbg-report) input[type='range']::-webkit-slider-thumb {
          border-color: Canvas;
          background: Highlight;
        }

        :where(.vbg-report) input[type='range']::-moz-range-track {
          background: CanvasText;
        }

        :where(.vbg-report) input[type='range']::-moz-range-thumb {
          border-color: Canvas;
          background: Highlight;
        }
      }

      /*
 * Typography modifiers belong after component typography so they remain
 * composable with any published component class without using !important.
 */
      :where(.vbg-report) .vbg-mono {
        font-family: var(--vbg-font-mono);
        font-variant-numeric: tabular-nums slashed-zero;
      }

      /* vbg-bundle:end */

      :root {
        --medula-box-fill: #f5f5f5;
        --medula-icon-filter: brightness(0);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --medula-box-fill: #1a1a1a;
          --medula-icon-filter: brightness(0) invert(1);
        }
      }
      .vbg-custom-shell {
        width: min(1440px, 100%, calc((100svh - 216px) * 2.3226 + 80px));
        margin-inline: auto;
        padding-inline: var(--vbg-space-10);
      }
      .vbg-custom-presentation {
        font-family: Geist, sans-serif;
        padding-block: var(--vbg-space-8);
        min-width: 0;
      }
      .vbg-custom-header {
        display: grid;
        gap: var(--vbg-space-2);
      }
      .vbg-custom-heading {
        font-size: var(--vbg-type-page-title);
        font-weight: var(--vbg-weight-heading);
        line-height: var(--vbg-leading-page-title);
        letter-spacing: -0.04em;
        margin: 0;
        text-wrap: balance;
      }
      .vbg-custom-subtitle {
        font-size: var(--vbg-type-lede);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-lede);
        color: var(--vbg-text-secondary);
        margin: 0;
      }
      .vbg-custom-diagram-scroll {
        min-width: 0;
        margin-block: var(--vbg-space-6);
      }
      .vbg-custom-graph {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .vbg-custom-box {
        height: 100%;
        box-sizing: border-box;
        padding: var(--vbg-space-6);
        border-radius: var(--vbg-radius-small);
        background: var(--medula-box-fill);
        border: 1px solid var(--vbg-border-default);
      }
      .vbg-custom-box.vbg-custom-agent,
      .vbg-custom-box.vbg-custom-app,
      .vbg-custom-box.vbg-custom-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .vbg-custom-box-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
        min-width: 0;
      }
      .vbg-custom-node-type {
        font-size: var(--vbg-type-lede);
        font-weight: var(--vbg-weight-medium);
        line-height: var(--vbg-leading-compact);
        color: var(--vbg-text-secondary);
        margin: 0 0 var(--vbg-space-4);
      }
      .vbg-custom-title {
        font-size: var(--vbg-type-section);
        font-weight: var(--vbg-weight-heading);
        line-height: var(--vbg-leading-section);
        letter-spacing: -0.02em;
        margin: 0;
      }
      .vbg-custom-brand {
        display: flex;
        align-items: center;
        gap: var(--vbg-space-3);
        margin: var(--vbg-space-4) 0 0;
        font-size: var(--vbg-type-lede);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-compact);
      }
      .vbg-custom-agent .vbg-custom-brand:first-child {
        margin-top: 0;
      }
      .vbg-custom-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        filter: var(--medula-icon-filter);
        flex-shrink: 0;
      }
      .vbg-custom-devframe-icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .vbg-custom-title-row {
        display: flex;
        align-items: center;
        gap: var(--vbg-space-3);
        min-width: 0;
      }
      .vbg-custom-tag {
        font-size: var(--vbg-type-body);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-body);
        color: var(--vbg-text-secondary);
        margin-top: var(--vbg-space-4);
      }
      .vbg-custom-browser-top {
        display: flex;
        align-items: center;
        gap: var(--vbg-space-2);
        font-size: var(--vbg-type-body);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-body);
        color: var(--vbg-text-secondary);
        height: 100%;
      }
      .vbg-custom-browser-top .vbg-custom-icon {
        width: 20px;
        height: 20px;
      }
      .vbg-custom-dots {
        display: flex;
        gap: 6px;
        margin-right: var(--vbg-space-3);
      }
      .vbg-custom-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--vbg-border-strong);
      }
      .vbg-custom-browser-top span {
        margin-left: var(--vbg-space-2);
      }
      .vbg-custom-frameworks {
        display: flex;
        align-items: center;
        gap: var(--vbg-space-3);
        margin-left: auto;
      }
      .vbg-custom-line-label {
        font-size: var(--vbg-type-body);
        fill: var(--vbg-text-primary);
        font-family: Geist, sans-serif;
        font-weight: var(--vbg-weight-medium);
      }
      .vbg-custom-small-label {
        font-size: var(--vbg-type-label);
        fill: var(--vbg-text-secondary);
        font-family: Geist, sans-serif;
        font-weight: var(--vbg-weight-regular);
      }
      .vbg-custom-footer {
        display: flex;
        justify-content: space-between;
        gap: var(--vbg-space-6);
        align-items: center;
      }
      .vbg-custom-credit {
        color: var(--vbg-text-secondary);
        font-size: var(--vbg-type-label);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-caption);
        margin: 0;
      }
      .vbg-custom-legend {
        display: flex;
        gap: var(--vbg-space-6);
        color: var(--vbg-text-secondary);
        font-size: var(--vbg-type-label);
        font-weight: var(--vbg-weight-regular);
        line-height: var(--vbg-leading-caption);
      }
      .vbg-custom-legend span {
        display: flex;
        align-items: center;
        gap: var(--vbg-space-2);
      }
      .vbg-custom-legend i {
        width: 22px;
        border-top: 2px solid var(--vbg-text-primary);
      }
      .vbg-custom-legend .vbg-custom-panel-line {
        border-top: 2px dashed var(--vbg-text-secondary);
      }
      @media (max-width: 900px) {
        .vbg-custom-shell {
          width: 100%;
          padding-inline: var(--vbg-space-6);
        }
        .vbg-custom-diagram-scroll {
          overflow-x: auto;
        }
        .vbg-custom-graph {
          min-width: 1050px;
        }
        .vbg-custom-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: var(--vbg-space-4);
        }
        .vbg-custom-legend {
          flex-wrap: wrap;
          gap: var(--vbg-space-4);
        }
      }
      @media print {
        .vbg-custom-shell {
          width: 100%;
          padding-inline: 0;
        }
        .vbg-custom-presentation {
          padding-block: var(--vbg-space-4);
        }
        .vbg-custom-graph {
          min-width: 0 !important;
        }
        .vbg-custom-diagram-scroll {
          overflow: visible;
        }
        @page {
          size: landscape;
          margin: 10mm;
        }
      }
    </style>
  </head>
