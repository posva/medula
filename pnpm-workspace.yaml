ignoreWorkspaceRootCheck: true
strictPeerDependencies: false
packages:
  - playgrounds/*
# Local devframe build from PR devframes/devframe#376 (branch eager-client-script).
# Replace with npm versions once the PR is released.
overrides:
  devframe: file:./vendor/devframe-0.9.18.tgz
  '@devframes/next': file:./vendor/devframes-next-0.9.18.tgz
allowBuilds:
  esbuild: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@devframes/hub@0.9.19'
  - '@devframes/plugin-code-server@0.9.19'
  - '@devframes/plugin-data-inspector@0.9.19'
  - '@nuxt/devtools-kit@4.0.0-alpha.19'
  - '@nuxt/devtools@4.0.0-alpha.19'
  - '@devframes/vite@0.9.19'
